{% extends "base.html"%}

{%block title%} tasks {%endblock%}

{%block content%}
<div class="task-box">
    <h2> your tasks</h2>
    <form class="task-form" method="post" action="{{url_for('tasks.add_task')}}">
        <input type="text" name="title" placeholder="new task" required>
        <button type="submit" class="btn">Add</button>
    </form>

    {%if tasks %}
    <form method="post" action="{{url_for('tasks.clear_tasks')}}">
     <button type="submit" class=" btn btn_clear">clear all tasks</button>

    </form>
    <br>
    <table>
        <thead>
            <tr>
                <th>task</th>
                <th>status</th>
                <th>change</th>
            </tr>
        </thead>
        <tbody>
            {%for task in tasks%}
            <tr>
                <td>{{task.title}}</td>
                <td> 
                    <span class="badge {{task.status|lower}}">{{task.status}}</span>
                </td>
                <td>
                    <form action="{{url_for('tasks.toggle_status', task_id = task.id)}}" method="post">
                        <button class="btn_small" type="submit">Next</button>
                    </form>
                </td>
            </tr>
            {%endfor%}

        </tbody>
    </table>
    {% else %}
        <p>No tasks yet. Add one above!</p>
    {%endif%}
</div>
{%endblock%}
